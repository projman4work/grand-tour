<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Grand Tour &middot; Summer 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#8f9e80;
    --sage-deep:#6c7a5e;
    --sage-shadow:#586549;
    --parchment:#f6f1e3;
    --parchment-2:#eee4cf;
    --parchment-edge:#e3d8bc;
    --ink:#272c22;
    --ink-soft:#454c3c;
    --muted:#6f7461;
    --gold:#a9854a;
    --gold-deep:#876733;
    --burgundy:#7b3a33;
    --burgundy-soft:#9a544b;
    --line:#cfc6aa;
    --radius:3px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 50% -10%, rgba(255,255,255,.10), transparent 60%),
      radial-gradient(circle at 50% 120%, rgba(0,0,0,.14), transparent 55%),
      var(--sage);
    color:var(--ink);
    font-family:"EB Garamond", Georgia, "Times New Roman", serif;
    font-size:18px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  /* faint engraved paper texture */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.05;
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.6) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }

  .wrap{position:relative; z-index:1; max-width:880px; margin:0 auto; padding:34px 22px 90px;}

  /* ---------- Masthead ---------- */
  .mast{ text-align:center; color:var(--parchment); padding:14px 0 26px; }
  .mast .eyebrow{
    font-family:"EB Garamond",serif; text-transform:uppercase; letter-spacing:.42em;
    font-size:12px; opacity:.85; margin-bottom:14px; padding-left:.42em;
  }
  .mast h1{
    font-family:"Cormorant Garamond", serif; font-weight:600;
    font-size:clamp(40px, 9vw, 74px); line-height:.98; margin:0; letter-spacing:.5px;
    text-shadow:0 2px 0 rgba(0,0,0,.10);
  }
  .mast h1 .amp{ font-style:italic; font-weight:500; color:#e9dfc4; }
  .mast .sub{
    font-family:"Cormorant Garamond",serif; font-style:italic; font-size:clamp(18px,3vw,24px);
    margin-top:10px; opacity:.95;
  }
  .rule-orn{ display:flex; align-items:center; justify-content:center; gap:14px; margin:18px auto 6px; max-width:340px; opacity:.9;}
  .rule-orn .ln{ height:1px; background:var(--parchment); flex:1; opacity:.6;}
  .rule-orn svg{ width:26px; height:26px; color:var(--parchment); }

  .stats{
    display:flex; justify-content:center; gap:0; flex-wrap:wrap; margin-top:14px;
    color:var(--parchment);
  }
  .stats .stat{ padding:0 20px; text-align:center; border-right:1px solid rgba(255,255,255,.28); }
  .stats .stat:last-child{ border-right:none; }
  .stats .num{ font-family:"Cormorant Garamond",serif; font-size:30px; font-weight:600; line-height:1; }
  .stats .lbl{ text-transform:uppercase; letter-spacing:.22em; font-size:10.5px; opacity:.82; margin-top:4px;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center;
    margin:18px 0 30px;
  }
  button{ font-family:"EB Garamond",serif; cursor:pointer; }
  .btn{
    background:var(--parchment); color:var(--ink); border:1px solid var(--gold);
    padding:7px 14px; border-radius:var(--radius); font-size:14px; letter-spacing:.04em;
    transition:all .15s ease; white-space:nowrap;
  }
  .btn:hover{ background:var(--gold); color:#fff7e6; }
  .btn.ghost{ background:transparent; color:var(--parchment); border-color:rgba(255,255,255,.55); }
  .btn.ghost:hover{ background:rgba(255,255,255,.12); color:#fff; }
  .btn.on{ background:var(--gold); color:#fff7e6; box-shadow:inset 0 0 0 1px rgba(255,255,255,.4); }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }

  /* ---------- Timeline ---------- */
  .timeline{ position:relative; padding-left:34px; }
  .timeline::before{
    content:""; position:absolute; left:9px; top:8px; bottom:8px; width:2px;
    background:linear-gradient(var(--parchment-edge), var(--gold) , var(--parchment-edge));
    opacity:.6;
  }
  .node{ position:relative; margin:0 0 16px; }
  .node .dot{
    position:absolute; left:-34px; top:20px; width:20px; height:20px; transform:translateX(0);
    color:var(--gold);
  }
  .node .dot svg{ width:20px; height:20px; display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }

  /* Stop card */
  .card{
    background:linear-gradient(180deg, var(--parchment), var(--parchment-2));
    border:1px solid var(--parchment-edge);
    border-radius:var(--radius);
    box-shadow:0 6px 18px rgba(40,46,30,.22), inset 0 0 0 1px rgba(255,255,255,.35);
    position:relative; overflow:hidden;
  }
  .card::after{ /* thin inner frame */
    content:""; position:absolute; inset:5px; border:1px solid rgba(169,133,74,.32); border-radius:2px; pointer-events:none;
  }
  .card-head{ display:flex; align-items:flex-start; gap:14px; padding:18px 20px; cursor:pointer; }
  .card-head .grow{ flex:1; min-width:0; }
  .place-kicker{ display:flex; align-items:center; gap:9px; margin-bottom:2px; flex-wrap:wrap;}
  .flag{
    font-family:"EB Garamond",serif; text-transform:uppercase; letter-spacing:.2em; font-size:10.5px;
    color:var(--gold-deep); border:1px solid var(--line); padding:1px 7px; border-radius:20px; background:rgba(255,255,255,.4);
  }
  .place-name{ font-family:"Cormorant Garamond",serif; font-weight:600; font-size:30px; line-height:1.04; margin:0; color:var(--ink);}
  .place-region{ font-style:italic; color:var(--muted); font-size:16px; }
  .dates{ font-family:"EB Garamond",serif; font-size:14px; color:var(--ink-soft); margin-top:5px; letter-spacing:.02em;}
  .lodging{ font-size:15px; color:var(--ink-soft); margin-top:4px; }
  .lodging .lk{ color:var(--muted); text-transform:uppercase; letter-spacing:.16em; font-size:10.5px; margin-right:6px;}
  .summary{ font-style:italic; color:var(--ink-soft); margin-top:9px; font-size:16.5px; }

  .chev{ color:var(--gold-deep); flex:none; transition:transform .2s ease; margin-top:6px;}
  .node.open .chev{ transform:rotate(90deg); }
  .chev svg{ width:16px; height:16px; display:block; }

  .body{ display:none; padding:0 20px 20px; }
  .node.open .body{ display:block; }

  .grp{ margin-top:16px; }
  .grp-title{
    display:flex; align-items:center; gap:10px; margin:0 0 8px;
    font-family:"EB Garamond",serif; text-transform:uppercase; letter-spacing:.24em; font-size:11.5px; color:var(--gold-deep);
  }
  .grp-title .gl{ height:1px; background:var(--line); flex:1; }
  .item{ padding:8px 0; border-bottom:1px dashed rgba(169,133,74,.28); }
  .item:last-child{ border-bottom:none; }
  .item-top{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .item-title{ font-weight:600; color:var(--ink); font-size:17px; }
  .item-note{ color:var(--ink-soft); font-size:15.5px; }
  .tags{ display:inline-flex; gap:6px; flex-wrap:wrap; vertical-align:middle;}
  .tag{ font-family:"EB Garamond",serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; padding:1px 8px; border-radius:20px; line-height:1.7; }
  .tag.ticket{ background:var(--burgundy); color:#f7e9e2; }
  .tag.booked{ background:#3f5b3c; color:#eef6ea; }
  .tag.tobook{ background:#bb8a36; color:#fff6e3; }
  .tag.idea{ background:#e7ddc4; color:var(--gold-deep); border:1px solid var(--line); }
  .item .mini{ margin-top:5px; display:flex; gap:6px; }

  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--gold-deep);
    border-radius:var(--radius); padding:2px 9px; font-size:12.5px; letter-spacing:.04em;
  }
  .icon-btn:hover{ background:var(--gold); color:#fff7e6; border-color:var(--gold);}
  .icon-btn.danger:hover{ background:var(--burgundy); border-color:var(--burgundy); color:#fff;}

  .card-tools{ display:flex; gap:6px; padding:0 20px 16px; }

  /* Journey card */
  .journey{
    background:rgba(246,241,227,.55);
    border:1px dashed var(--gold); border-radius:var(--radius);
    padding:12px 16px; display:flex; gap:14px; align-items:flex-start;
  }
  .journey .mode{ color:var(--gold-deep); flex:none; margin-top:2px;}
  .journey .mode svg{ width:26px; height:26px; display:block; }
  .journey .jgrow{ flex:1; min-width:0;}
  .journey .route{ font-family:"Cormorant Garamond",serif; font-weight:600; font-size:21px; color:var(--ink); line-height:1.1;}
  .journey .route .arr{ color:var(--gold-deep); margin:0 7px; }
  .journey .jmeta{ font-size:14px; color:var(--ink-soft); margin-top:3px; }
  .journey .jmeta b{ font-weight:600; }
  .journey .jnote{ font-style:italic; color:var(--muted); font-size:14.5px; margin-top:4px; }
  .journey .jtools{ display:flex; gap:6px; margin-top:8px; }

  /* Options (the France decision) */
  .options{ margin-top:12px; display:grid; gap:10px; }
  .opt{
    background:#fff; border:1px solid var(--parchment-edge); border-left:3px solid var(--gold);
    border-radius:var(--radius); padding:11px 13px;
  }
  .opt h4{ margin:0 0 4px; font-family:"Cormorant Garamond",serif; font-size:19px; color:var(--ink); font-weight:600;}
  .opt .od{ font-size:15px; color:var(--ink-soft); }
  .opt .pc{ display:flex; gap:18px; flex-wrap:wrap; margin-top:6px; font-size:14px;}
  .opt .pc .pcl{ text-transform:uppercase; letter-spacing:.14em; font-size:10px; }
  .opt .pros .pcl{ color:#3f5b3c;} .opt .cons .pcl{ color:var(--burgundy);}
  .decision{
    margin-top:10px; background:rgba(123,58,51,.06); border:1px solid rgba(123,58,51,.25);
    border-radius:var(--radius); padding:10px 13px; font-size:15px;
  }
  .decision .dl{ text-transform:uppercase; letter-spacing:.18em; font-size:10.5px; color:var(--burgundy); margin-right:8px;}

  .add-item-row{ margin-top:12px; }

  /* ---------- Modal ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(40,46,30,.55); backdrop-filter:blur(2px); display:none; z-index:50; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px;}
  .scrim.show{ display:flex; }
  .modal{
    background:linear-gradient(180deg,var(--parchment),var(--parchment-2));
    border:1px solid var(--gold); border-radius:var(--radius);
    box-shadow:0 24px 60px rgba(0,0,0,.4); width:100%; max-width:560px; padding:24px; position:relative;
  }
  .modal h3{ font-family:"Cormorant Garamond",serif; font-size:28px; font-weight:600; margin:0 0 4px;}
  .modal .mhint{ font-style:italic; color:var(--muted); margin:0 0 16px; font-size:15px;}
  .fld{ margin-bottom:13px; }
  .fld label{ display:block; text-transform:uppercase; letter-spacing:.16em; font-size:10.5px; color:var(--gold-deep); margin-bottom:4px;}
  .fld input, .fld select, .fld textarea{
    width:100%; font-family:"EB Garamond",serif; font-size:16px; color:var(--ink);
    background:#fffdf6; border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px;
  }
  .fld textarea{ min-height:62px; resize:vertical; }
  .fld.check{ display:flex; align-items:center; gap:8px;}
  .fld.check input{ width:auto; }
  .fld.check label{ margin:0; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:18px; align-items:center;}
  .modal-actions .right{ display:flex; gap:8px; }
  .opt-edit{ border:1px dashed var(--line); border-radius:var(--radius); padding:12px; margin-bottom:10px; position:relative;}
  .opt-edit .rm{ position:absolute; top:8px; right:8px; }

  .empty{ text-align:center; color:var(--parchment); opacity:.85; font-style:italic; padding:40px 0;}
  .foot{ text-align:center; color:var(--parchment); opacity:.7; font-size:13px; margin-top:34px; font-style:italic;}

  @media (max-width:560px){
    body{ font-size:17px; }
    .place-name{ font-size:25px; }
    .stats .stat{ padding:0 12px; }
    .two{ grid-template-columns:1fr; }
    .card-head{ padding:15px; }
  }
  @media print{
    body{ background:#fff; color:#000; }
    .toolbar,.card-tools,.icon-btn,.add-item-row,.chev{ display:none !important; }
    .node .body{ display:block !important; }
    .mast,.stats,.foot{ color:#000; }
  }
  /* ---------- Hotel shortlist ---------- */
  .stays{ display:block; }
  .stay{ background:#fffdf6; border:1px solid var(--parchment-edge); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; box-shadow:0 2px 8px rgba(40,46,30,.10); }
  .stay-body{ padding:14px 16px; }
  .stay-head{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .stay-go{ margin-left:auto; flex:none; display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; border:1px solid var(--gold); color:var(--gold-deep); text-decoration:none; transition:all .15s ease; }
  .stay-go:hover{ background:var(--gold); color:#fff7e6; }
  .stay-go svg{ width:16px; height:16px; }
  .stay-rank{ font-family:"Cormorant Garamond",serif; font-size:23px; font-weight:600; color:var(--gold-deep); }
  .stay-name{ font-family:"Cormorant Garamond",serif; font-size:22px; font-weight:600; color:var(--ink); line-height:1.05; }
  .stay-area{ font-style:italic; color:var(--muted); font-size:15px; }
  .stay-meta{ display:flex; gap:8px; flex-wrap:wrap; margin:9px 0 4px; }
  .score-badge{ background:#3f5b3c; color:#eef6ea; border-radius:20px; padding:2px 11px; font-size:13px; }
  .price-badge{ background:var(--parchment-2); color:var(--ink-soft); border:1px solid var(--line); border-radius:20px; padding:2px 11px; font-size:13px; }
  .pc-cols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:8px; }
  .pc-cols h5{ margin:0 0 5px; text-transform:uppercase; letter-spacing:.16em; font-size:10.5px; }
  .pc-cols .good h5{ color:#3f5b3c; }
  .pc-cols .bad h5{ color:var(--burgundy); }
  .pc-cols ul{ margin:0; padding-left:16px; }
  .pc-cols li{ font-size:14.5px; color:var(--ink-soft); margin-bottom:4px; }
  .stay-link{ margin-top:12px; font-size:13.5px; }
  @media (max-width:560px){ .pc-cols{ grid-template-columns:1fr; } }

  /* ---------- Live sync + ranking ---------- */
  .sync{ font-family:"EB Garamond",serif; font-size:12px; text-transform:uppercase; letter-spacing:.18em; padding:5px 13px; border-radius:20px; border:1px solid rgba(255,255,255,.45); color:var(--parchment); align-self:center; }
  .sync.on{ background:rgba(63,91,60,.55); border-color:#bfe0b8; }
  .sync.off{ opacity:.7; }
  .sync.wait{ opacity:.9; }
  .rank-hint{ font-style:italic; color:var(--muted); font-size:13px; margin:-2px 0 9px; }
  .rank-ctrl{ display:inline-flex; flex-direction:column; gap:2px; margin-right:3px; }
  .rk{ border:1px solid var(--line); background:transparent; color:var(--gold-deep); border-radius:3px; font-size:9px; line-height:1; padding:2px 5px; }
  .rk:hover{ background:var(--gold); color:#fff7e6; border-color:var(--gold); }
  .lodge-go{ display:inline-flex; vertical-align:middle; margin-left:6px; color:var(--gold-deep); text-decoration:none; }
  .lodge-go svg{ width:14px; height:14px; }
  .lodge-go:hover{ color:var(--gold); }

</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="eyebrow" id="eyebrow">An Itinerary</div>
    <h1 id="title">The Grand Tour</h1>
    <div class="sub" id="subtitle">Nashville &middot; London &middot; Devon &middot; Paris &middot; South of France &middot; Barcelona</div>
    <div class="rule-orn">
      <span class="ln"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"><circle cx="12" cy="12" r="9"/><path d="M12 4l2.2 5.8L20 12l-5.8 2.2L12 20l-2.2-5.8L4 12l5.8-2.2z"/></svg>
      <span class="ln"></span>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="btn-row">
      <button class="btn ghost" id="addStop">+ Add stop</button>
      <button class="btn ghost" id="addJourney">+ Add journey</button>
      <button class="btn ghost" id="filterBook">Show bookings only</button>
      <button class="btn ghost" id="expandAll">Collapse all</button>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="editHead">Rename trip</button>
      <button class="btn ghost" id="exportBtn">Export</button>
      <button class="btn ghost" id="importBtn">Import</button>
      <button class="btn ghost" id="resetBtn">Reset</button>
    </div>
    <span id="syncStatus" class="sync off">Local only</span>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="foot">Everything here is editable, and changes save in this browser. Use Export to back it up or send a copy across.</div>
</div>

<!-- Modal -->
<div class="scrim" id="scrim">
  <div class="modal" id="modal"></div>
</div>

<script>
"use strict";

/* ============================================================
   ICONS (engraved line style)
============================================================ */
const ICON = {

  go:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};
const CAT = { see:"See & Do", eat:"Eat & Drink", exp:"Experiences", note:"Good to know" };
const CAT_ORDER = ["see","eat","exp","note"];

/* ============================================================
   SEED ITINERARY  (researched May 2026 — all editable)
============================================================ */
const SEED = {
  "meta": {
    "eyebrow": "Volume I",
    "title": "A <span class='amp'>+</span> B's First Grand Tour",
    "subtitle": "Nashville &middot; London &middot; Devon &middot; Paris &middot; South of France &middot; Barcelona"
  },
  "items": [
    {
      "id": "jb0",
      "type": "journey",
      "mode": "plane",
      "who": "ben",

/* ============================================================
   STATE
============================================================ */
const KEY = "grandtour.v7";
let state = load() || clone(SEED);
let expanded = new Set(state.items.filter(i=>i.type==="stop").map(i=>i.id)); // start expanded
let bookFilter = false;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ console.warn("save failed",e); }
  if(window.cloud && window.cloud.save){ window.cloud.save(state); }
}
window.getState=function(){ return state; };
window.applyRemote=function(remote){
  if(!remote || !remote.items) return;
  state=remote;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  render();
};
function uid(p){ return p + Math.random().toString(36).slice(2,8); }

/* ============================================================
   HELPERS
============================================================ */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function parseISO(s){ if(!s) return null; const p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtDay(s){ const d=parseISO(s); if(!d) return ""; return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function fmtRange(a,b){
  const da=parseISO(a), db=parseISO(b);
  if(!da) return "";
  if(!db || a===b) return fmtDay(a)+" "+da.getFullYear();
  const yr = (da.getFullYear()===db.getFullYear()) ? " "+db.getFullYear() : "";
  let n = Math.round((db-da)/86400000);
  const nights = n>0 ? "  ·  "+n+(n===1?" night":" nights") : "";
  return fmtDay(a)+" – "+fmtDay(b)+yr+nights;
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function statusTag(st){
  if(st==="booked") return '<span class="tag booked">Booked</span>';
  if(st==="tobook") return '<span class="tag tobook">To book</span>';
  if(st==="idea") return '<span class="tag idea">Idea</span>';
  return "";
}

   STATS
============================================================ */
function renderStats(){
  const stops = state.items.filter(i=>i.type==="stop");
  const allDates = state.items.flatMap(i=> [i.date, i.dateStart, i.dateEnd]).filter(Boolean).map(parseISO).filter(Boolean);
  let days="–";
  if(allDates.length){ const min=new Date(Math.min(...allDates)), max=new Date(Math.max(...allDates)); days=Math.round((max-min)/86400000)+1; }
  const countries = new Set(stops.map(s=>s.country).filter(Boolean)).size;
  let toBook=0;
  state.items.forEach(i=>{
    if(i.type==="journey" && (i.status==="tobook")) toBook++;
    if(i.type==="stop"){ if(i.lodgingStatus==="tobook") toBook++; (i.guide||[]).forEach(g=>{ if(g.status==="tobook"||(g.ticket && g.status!=="booked")) toBook++; }); }
  });
  const el=document.getElementById("stats");
  el.innerHTML =
    stat(days,"Days") + stat(countries,"Countries") + stat(stops.length,"Stops") + stat(toBook,"To sort");
}
function stat(n,l){ return '<div class="stat"><div class="num">'+n+'</div><div class="lbl">'+l+'</div></div>'; }

// ---- Calendar export (.ics — imports into Google Calendar & Outlook) ----
window.exportICS = function(){
  const pad = n => String(n).padStart(2,"0");
  const whoName = {alexis:"Alexis", ben:"Ben", both:"Both"};
  const toMin = t => { if(!t) return null; const m=String(t).match(/(\d{1,2}):(\d{2})/); if(!m) return null; let h=+m[1]; const mm=+m[2]; if(/pm/i.test(t)&&h<12)h+=12; if(/am/i.test(t)&&h===12)h=0; return h*60+mm; };
  const stampDay = d => d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const dtLocal = (iso,t) => { const d=parseISO(iso); if(!d) return null; const mins=toMin(t)||0; return stampDay(d)+"T"+pad(Math.floor(mins/60))+pad(mins%60)+"00"; };
  const escI = s => (s==null?"":String(s)).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Grand Tour 2026//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:Grand Tour 2026"];
  let uid=0;
  const add = o => {
    L.push("BEGIN:VEVENT","UID:gt"+(uid++)+"@grandtour2026","DTSTAMP:20260101T000000Z");
    if(o.allday){ L.push("DTSTART;VALUE=DATE:"+o.start); L.push("DTEND;VALUE=DATE:"+o.end); }
    else { L.push("DTSTART:"+o.start); if(o.end) L.push("DTEND:"+o.end); }
    L.push("SUMMARY:"+escI(o.summary));
    if(o.desc) L.push("DESCRIPTION:"+escI(o.desc));
    if(o.cat) L.push("CATEGORIES:"+escI(o.cat));
    L.push("END:VEVENT");
  };
  (state.items||[]).forEach(it=>{
    if(it.type==="journey"){
      const kind = it.mode==="plane" ? "Flight" : (it.mode==="train" ? "Train" : "Travel");
      const who = whoName[it.who||"both"];
      const start = it.depart ? dtLocal(it.date, it.depart) : null;
      let end = (start && it.arrive) ? dtLocal(it.date, it.arrive) : null;
      if(start && end && end <= start){ const d=parseISO(it.date); d.setDate(d.getDate()+1); const mins=toMin(it.arrive)||0; end = stampDay(d)+"T"+pad(Math.floor(mins/60))+pad(mins%60)+"00"; }
      const summary = kind+" ("+who+"): "+(it.from||"")+" → "+(it.to||"");
      const desc = [it.operator, it.duration, it.note].filter(Boolean).join(" — ");
      if(start) add({start:start, end:end, summary:summary, desc:desc, cat:who});
      else { const d=parseISO(it.date); const nx=new Date(d); nx.setDate(nx.getDate()+1); add({allday:true, start:stampDay(d), end:stampDay(nx), summary:summary, desc:desc, cat:who}); }
    } else if(it.type==="event" && it.date){
      const who = whoName[it.who||"both"];
      if(it.time){
        const start = dtLocal(it.date, it.time);
        const total=(toMin(it.time)||0)+(it.mins||60); const d=parseISO(it.date); d.setDate(d.getDate()+Math.floor(total/1440)); const mm=total%1440; const end=stampDay(d)+"T"+pad(Math.floor(mm/60))+pad(mm%60)+"00";
        add({start:start, end:end, summary:who+": "+it.title, desc:it.location||"", cat:who});
      } else {
        const d=parseISO(it.date); const nx=new Date(d); nx.setDate(nx.getDate()+1);
        add({allday:true, start:stampDay(d), end:stampDay(nx), summary:who+": "+it.title, desc:it.location||"", cat:who});
      }
    } else if(it.dateStart){
      const a=parseISO(it.dateStart), b=parseISO(it.dateEnd||it.dateStart);
      add({allday:true, start:stampDay(a), end:stampDay(b), summary:(it.place||"Stay")+(it.lodgingName?" — "+it.lodgingName:""), desc:[it.lodgingType, it.summary].filter(Boolean).join("\n")});
    }
  });
  L.push("END:VCALENDAR");
  const blob = new Blob([L.join("\r\n")], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "grand-tour-2026.ics";
  document.body.appendChild(a); a.click(); a.remove();
};

function addTickets(files){

function renderTicketList(){
  var el=document.getElementById("ticketList"); if(!el) return;
  if(!window.__tickets.length){ el.innerHTML='<div class="docs-sub" style="margin:6px 0 0">No tickets yet — drop PDFs above.</div>'; return; }
  el.innerHTML=window.__tickets.map(function(t,i){
    return '<div class="tk-row"><span class="nm">'+(i+1)+'. '+esc(t.name)+'</span>'+
      '<button onclick="moveTicket('+i+',-1)" title="Up">&#9650;</button>'+
      '<button onclick="moveTicket('+i+',1)" title="Down">&#9660;</button>'+
      '<button onclick="printTicket('+i+')">Print</button>'+
      '<button onclick="removeTicket('+i+')">Remove</button></div>';
  }).join("");
}
window.moveTicket=function(i,d){ var a=window.__tickets, j=i+d; if(j<0||j>=a.length) return; var t=a[i]; a[i]=a[j]; a[j]=t; renderTicketList(); };
window.removeTicket=function(i){ window.__tickets.splice(i,1); renderTicketList(); };
window.printTicket=function(i){ var t=window.__tickets[i]; if(!t) return; var url=URL.createObjectURL(new Blob([t.bytes],{type:"application/pdf"})); window.open(url,"_blank"); };
function ensurePdfLib(){ return window.PDFLib ? Promise.resolve() : new Promise(function(res,rej){ var s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"; s.onload=res; s.onerror=function(){ rej(new Error("could not load PDF tools")); }; document.head.appendChild(s); }); }
window.printAllTickets=function(){
  if(!window.__tickets.length){ alert("Drop your ticket PDFs in first."); return; }
  ensurePdfLib().then(function(){
    var PDFDocument=window.PDFLib.PDFDocument;
    return PDFDocument.create().then(function(merged){
      var chain=Promise.resolve();
      window.__tickets.forEach(function(t){
        chain=chain.then(function(){ return PDFDocument.load(t.bytes.slice(0)).then(function(src){ return merged.copyPages(src, src.getPageIndices()).then(function(pages){ pages.forEach(function(p){ merged.addPage(p); }); }); }); });
      });
      return chain.then(function(){ return merged.save(); }).then(function(bytes){ window.open(URL.createObjectURL(new Blob([bytes],{type:"application/pdf"})),"_blank"); });
    });
  }).catch(function(e){ alert("Could not merge the PDFs: "+((e&&e.message)||e)); });
};

window.setupDocuments=function(){
  if(document.getElementById("docs-panel")){ renderTicketList(); return; }
  var tl=document.getElementById("timeline"); if(!tl||!tl.parentNode) return;
  var sec=document.createElement("section"); sec.id="docs-panel"; sec.className="docs";
  sec.innerHTML=
    '<h2 class="docs-h">Documents</h2>'+
    '<div class="docs-row"><button class="docs-btn" onclick="openItineraryPrint()">Preview &amp; print itinerary</button></div>'+
    '<div class="docs-sub">Tickets (Alexis) — drag &amp; drop PDFs, reorder, then print</div>'+
    '<div id="dropzone" class="dropzone">Drop ticket PDFs here, or click to choose</div>'+
    '<input type="file" id="ticketInput" accept="application/pdf" multiple style="display:none">'+
    '<div id="ticketList" class="ticket-list"></div>'+
    '<div class="docs-row" style="margin-top:12px"><button class="docs-btn ghost" onclick="printAllTickets()">Print all tickets (in order)</button></div>';
  var tb=document.querySelector(".toolbar");
  if(tb) tb.insertAdjacentElement("afterend", sec); else tl.parentNode.insertBefore(sec, tl);
  var dz=document.getElementById("dropzone"), inp=document.getElementById("ticketInput");
  dz.addEventListener("click",function(){ inp.click(); });
  inp.addEventListener("change",function(e){ addTickets(e.target.files); inp.value=""; });
  ["dragover","dragenter"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.add("over"); }); });
  ["dragleave","drop"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.remove("over"); }); });
  dz.addEventListener("drop",function(e){ if(e.dataTransfer&&e.dataTransfer.files) addTickets(e.dataTransfer.files); });
  renderTicketList();
};

function buildItin(){
  var items=(state.items||[]);
  var whoTag={alexis:" (Alexis)", ben:" (Ben)", both:""};
  var placeSection={"London & The Chilterns":"Arrival & the South Coast","Cary Arms & Spa":"Arrival & the South Coast","Paris":"Paris","South of France":"South of France","Barcelona":"Barcelona","London & Home":"Back to the UK & the Wedding","London — the wedding":"Back to the UK & the Wedding","Home, Prestwood":"Back to the UK & the Wedding","Nashville":"Nashville"};
  var secOf=function(pl){ return placeSection[pl]||pl||"Other"; };
  var nextStop=function(idx){ for(var j=idx+1;j<items.length;j++) if(items[j].type==="stop") return secOf(items[j].place); return null; };
  var prevStop=function(idx){ for(var j=idx-1;j>=0;j--) if(items[j].type==="stop") return secOf(items[j].place); return null; };
  var bySection={}, order=[];
  items.forEach(function(it,idx){
    var sec = it.type==="stop"?secOf(it.place):(it.type==="journey"?(nextStop(idx)||prevStop(idx)||"Travel"):(prevStop(idx)||nextStop(idx)||"Events"));
    if(!bySection[sec]){ bySection[sec]=[]; order.push(sec); }
    bySection[sec].push(it);
  });
  var D1=function(s){ var d=parseISO(s); return d?DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]:""; };
  var strip=function(s){ return (s==null?"":String(s)).replace(/<[^>]+>/g,"").replace(/&middot;/g,"·"); };
  function entry(it){
    if(it.type==="journey"){
      var det=[]; if(it.depart) det.push(esc(it.depart)+(it.arrive?" – "+esc(it.arrive):"")); if(it.operator) det.push(esc(it.operator));
      return '<div class="pe"><div class="pe-h">'+(it.mode==="train"?"Train":(it.mode==="plane"?"Flight":"Travel"))+': '+esc(it.from||"")+' &rarr; '+esc(it.to||"")+esc(whoTag[it.who||"both"])+'</div>'+
        '<div class="pe-m">'+esc(D1(it.date))+(det.length?' &middot; '+det.join(" &middot; "):"")+'</div>'+
        (it.note?'<div class="pe-n">'+esc(it.note)+'</div>':'')+'</div>';
    }
    if(it.type==="event"){
      return '<div class="pe"><div class="pe-h">'+esc(it.title||"")+esc(whoTag[it.who||"both"])+'</div>'+
        '<div class="pe-m">'+esc(D1(it.date))+(it.time?' &middot; '+esc(it.time):"")+(it.location?' &middot; '+esc(it.location):"")+'</div></div>';
    }
    if(!it.lodgingName && !it.dateStart) return "";
    var lodge = it.lodgingName ? '<div class="pe-h">'+esc(it.lodgingName)+(it.lodgingType?' &middot; '+esc(it.lodgingType):"")+'</div>'+(it.summary?'<div class="pe-n">'+esc(it.summary)+'</div>':"") : "";
    return '<div class="pe"><div class="pe-m">'+esc(it.place||"")+' &middot; '+esc(fmtRange(it.dateStart,it.dateEnd))+'</div>'+lodge+'</div>';
  }
  var body="";
  order.forEach(function(sec){ body+='<section class="psec"><h1 class="ptitle">'+esc(sec)+'</h1>'+ bySection[sec].map(entry).join("") +'</section>'; });
  var meta=state.meta||{};
  var css='html,body{background:#fff;color:#1c1c1c;}'+
    'body{font-family:Georgia,"Times New Roman",serif;line-height:1.5;padding:24px;max-width:720px;margin:0 auto;}'+
    '.no-print{position:fixed;top:12px;right:12px;}.pbtn{font:inherit;font-size:13px;padding:8px 16px;border:1px solid #1c1c1c;background:#1c1c1c;color:#fff;border-radius:20px;cursor:pointer;}'+
    '.cover{text-align:center;padding:32% 0;page-break-after:always;}'+
    '.cover .eb{text-transform:uppercase;letter-spacing:.3em;font-size:12px;color:#666;}.cover h1{font-size:42px;margin:14px 0 6px;}.cover .sub{color:#444;font-size:15px;}'+
    '.psec{page-break-before:always;}.ptitle{font-size:30px;border-bottom:2px solid #1c1c1c;padding-bottom:8px;margin:0 0 18px;}'+
    '.pe{margin:0 0 15px;padding-bottom:13px;border-bottom:1px solid #ddd;}.pe-h{font-weight:700;font-size:16px;}.pe-m{font-size:13px;color:#555;margin-top:2px;}.pe-n{font-size:13px;color:#333;margin-top:5px;}'+
    '@media print{.no-print{display:none;}}';
  var cover='<div class="cover"><div class="eb">'+esc(strip(meta.eyebrow||""))+'</div><h1>'+esc(strip(meta.title||"The Grand Tour"))+'</h1><div class="sub">'+esc(strip(meta.subtitle||""))+'</div></div>';
  return { css:css, inner:cover+body, title:strip(meta.title||"Itinerary") };
}
window.openItineraryPrint=function(){
  var d=buildItin();
  var doc='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(d.title)+'</title><style>@page{margin:18mm;}'+d.css+'</style></head><body>'+
    '<div class="no-print"><button class="pbtn" onclick="window.print()">Print</button></div>'+d.inner+'</body></html>';
  var w=window.open("","_blank");
  if(!w){ alert("Please allow pop-ups to preview the itinerary."); return; }
  w.document.open(); w.document.write(doc); w.document.close();
};
function ensureHtml2Pdf(){ return window.html2pdf ? Promise.resolve() : new Promise(function(res,rej){ var s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"; s.onload=res; s.onerror=function(){ rej(new Error("could not load PDF tools")); }; document.head.appendChild(s); }); }
window.downloadItineraryPDF=function(){
  var d=buildItin();
  ensureHtml2Pdf().then(function(){
    var el=document.createElement("div");
    el.style.cssText="position:fixed;left:-9999px;top:0;width:760px;background:#fff;";
    el.innerHTML='<style>'+d.css+'</style>'+d.inner;
    document.body.appendChild(el);
    return window.html2pdf().set({margin:[10,10,10,10], filename:"grand-tour-2026.pdf", image:{type:"jpeg",quality:0.96}, html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"}, jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, pagebreak:{mode:["css","legacy"]}}).from(el).save().then(function(){ setTimeout(function(){ el.remove(); },1500); });
  }).catch(function(e){ alert("Could not build the PDF: "+((e&&e.message)||e)); });
};

function node(inner, iconKey, openable, id){
  const n=document.createElement("div");
  n.className="node"+(openable && expanded.has(id)?" open":"");
  n.dataset.id=id||"";
  n.innerHTML = '<span class="dot">'+ICON[iconKey]+'</span>'+inner;
  return n;
}

function stopNode(s){
  const guide = (s.guide||[]).filter(g=> !bookFilter || g.ticket || g.status==="tobook" || g.status==="booked" );
  let groups="";
  CAT_ORDER.forEach(cat=>{
    const items = guide.filter(g=>g.cat===cat);
    if(!items.length) return;
    groups += '<div class="grp"><div class="grp-title">'+CAT[cat]+'<span class="gl"></span></div>'+
      items.map(g=>guideRow(s.id,g)).join("")+'</div>';
  });
  const addRow = '<div class="add-item-row"><button class="icon-btn" data-act="add-guide" data-stop="'+s.id+'">+ Add a tip</button></div>';
  let staysHtml="";
  if(s.stays && s.stays.length){
    staysHtml = '<div class="grp"><div class="grp-title">Where to stay &middot; shortlist<span class="gl"></span></div><div class="rank-hint">Use the arrows to rank these. Changes show for both of you.</div><div class="stays">'+
      s.stays.map((h,i)=>stayCard(h,i,s.id)).join("")+'</div></div>';
  }

  const inner =
    '<div class="card">'+
      '<div class="card-head" data-act="toggle" data-id="'+s.id+'">'+
        '<div class="grow">'+
          '<div class="place-kicker">'+(s.flag?'<span class="flag">'+esc(s.flag)+'</span>':'')+statusBadgeLodge(s)+'</div>'+
          '<h2 class="place-name">'+esc(s.place)+'</h2>'+
          (s.region?'<div class="place-region">'+esc(s.region)+'</div>':'')+
          '<div class="dates">'+fmtRange(s.dateStart,s.dateEnd)+'</div>'+
          (s.lodgingName?'<div class="lodging"><span class="lk">Stay</span>'+esc(s.lodgingName)+(s.lodgingType?' &middot; <i>'+esc(s.lodgingType)+'</i>':'')+(s.lodgingUrl?' <a class="lodge-go" href="'+esc(s.lodgingUrl)+'" target="_blank" rel="noopener" title="Open on Booking.com" aria-label="Open on Booking.com" onclick="event.stopPropagation()">'+ICON.go+'</a>':'')+'</div>':'')+
          (s.summary?'<div class="summary">'+esc(s.summary)+'</div>':'')+
        '</div>'+
        '<span class="chev">'+ICON.chev+'</span>'+
      '</div>'+
      '<div class="body">'+groups+staysHtml+addRow+'</div>'+
      '<div class="card-tools">'+
        '<button class="icon-btn" data-act="edit-stop" data-id="'+s.id+'">Edit stop</button>'+
        '<button class="icon-btn" data-act="up" data-id="'+s.id+'">&uarr;</button>'+
        '<button class="icon-btn" data-act="down" data-id="'+s.id+'">&darr;</button>'+
        '<button class="icon-btn danger" data-act="del" data-id="'+s.id+'">Remove</button>'+
      '</div>'+
    '</div>';
  return node(inner,"stop",true,s.id);
}
function statusBadgeLodge(s){ return s.lodgingStatus?statusTag(s.lodgingStatus):""; }

function stayCard(h,i,stopId){
  const go = h.url?'<a class="stay-go" href="'+esc(h.url)+'" target="_blank" rel="noopener" title="Open on Booking.com" aria-label="Open on Booking.com">'+ICON.go+'</a>':'';
  const ctrl = '<span class="rank-ctrl">'+
    '<button class="rk" data-act="stay-up" data-stop="'+stopId+'" data-slug="'+h.slug+'" title="Move up" aria-label="Move up">&#9650;</button>'+
    '<button class="rk" data-act="stay-down" data-stop="'+stopId+'" data-slug="'+h.slug+'" title="Move down" aria-label="Move down">&#9660;</button>'+
  '</span>';
  const pros=(h.pros||[]), cons=(h.cons||[]);
  const meta=(h.score||h.price)?'<div class="stay-meta">'+(h.score?'<span class="score-badge">'+esc(h.score)+'</span>':'')+(h.price?'<span class="price-badge">'+esc(h.price)+'</span>':'')+'</div>':'';
  const pc=(pros.length||cons.length)?'<div class="pc-cols">'+
        (pros.length?'<div class="good"><h5>Good</h5><ul>'+pros.map(p=>'<li>'+esc(p)+'</li>').join("")+'</ul></div>':'')+
        (cons.length?'<div class="bad"><h5>Worth knowing</h5><ul>'+cons.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul></div>':'')+
      '</div>':'';
  return '<div class="stay">'+
    '<div class="stay-body">'+
      '<div class="stay-head">'+ctrl+'<span class="stay-name">'+esc(h.name)+'</span><span class="stay-area">'+esc(h.area)+'</span>'+go+'</div>'+
      meta+pc+
    '</div>'+
  '</div>';
}

function guideRow(stopId,g){
  const tags = (g.ticket?'<span class="tag ticket">Ticket</span>':'') + statusTag(g.status);
  return '<div class="item">'+
    '<div class="item-top"><span class="item-title">'+esc(g.title)+'</span> '+
      (tags?'<span class="tags">'+tags+'</span>':'')+'</div>'+
    (g.note?'<div class="item-note">'+esc(g.note)+'</div>':'')+
    '<div class="mini">'+
      '<button class="icon-btn" data-act="edit-guide" data-stop="'+stopId+'" data-gid="'+g.id+'">Edit</button>'+
      '<button class="icon-btn danger" data-act="del-guide" data-stop="'+stopId+'" data-gid="'+g.id+'">Delete</button>'+
    '</div></div>';
}

function journeyNode(j){
  let optHtml="";
  if(j.options && j.options.length){
    optHtml = '<div class="options">'+ j.options.map(o=>
      '<div class="opt"><h4>'+esc(o.label)+'</h4>'+
        (o.detail?'<div class="od">'+esc(o.detail)+'</div>':'')+
        '<div class="pc">'+
          (o.pros?'<div class="pros"><span class="pcl">For</span> '+esc(o.pros)+'</div>':'')+
          (o.cons?'<div class="cons"><span class="pcl">Against</span> '+esc(o.cons)+'</div>':'')+
        '</div></div>'
      ).join("")+'</div>'+
      '<div class="decision"><span class="dl">Decision</span>'+(j.decision?esc(j.decision):'Not decided yet. Talk it through, then note it here.')+'</div>';
  }
  const meta=[];
  if(j.date) meta.push("<b>"+fmtDay(j.date)+"</b>");
  if(j.depart||j.arrive) meta.push((j.depart||"")+(j.arrive?" – "+j.arrive:""));
  if(j.duration) meta.push(esc(j.duration));
  if(j.operator) meta.push("<i>"+esc(j.operator)+"</i>");

  const inner =
    '<div class="journey">'+
      '<span class="mode">'+(ICON[j.mode]||ICON.car)+'</span>'+
      '<div class="jgrow">'+
        '<div class="route">'+esc(j.from)+'<span class="arr">&rarr;</span>'+esc(j.to)+' '+
          (j.status?'<span class="tags">'+statusTag(j.status)+'</span>':'')+'</div>'+
        (meta.length?'<div class="jmeta">'+meta.join("  ·  ")+'</div>':'')+
        (j.note?'<div class="jnote">'+esc(j.note)+'</div>':'')+
        optHtml+
        '<div class="jtools">'+
          '<button class="icon-btn" data-act="edit-journey" data-id="'+j.id+'">Edit</button>'+
          '<button class="icon-btn" data-act="up" data-id="'+j.id+'">&uarr;</button>'+
          '<button class="icon-btn" data-act="down" data-id="'+j.id+'">&darr;</button>'+
          '<button class="icon-btn danger" data-act="del" data-id="'+j.id+'">Remove</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  return node(inner,j.mode||"car",false,j.id);
}

/* ============================================================
   EVENTS (delegation)
============================================================ */
document.getElementById("timeline").addEventListener("click", e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, id=t.dataset.id, stop=t.dataset.stop, gid=t.dataset.gid, slug=t.dataset.slug;
  if(act==="toggle"){ const sid=t.dataset.id; if(expanded.has(sid)) expanded.delete(sid); else expanded.add(sid); render(); }
  else if(act==="edit-stop") openStop(id);
  else if(act==="edit-journey") openJourney(id);
  else if(act==="add-guide") openGuide(stop,null);
  else if(act==="edit-guide") openGuide(stop,gid);
  else if(act==="del-guide"){ const s=find(stop); s.guide=s.guide.filter(g=>g.id!==gid); save(); render(); }
  else if(act==="stay-up") moveStay(stop,slug,-1);
  else if(act==="stay-down") moveStay(stop,slug,1);
  else if(act==="up") moveItem(id,-1);
  else if(act==="down") moveItem(id,1);
  else if(act==="del"){ if(confirm("Remove this from the itinerary?")){ state.items=state.items.filter(i=>i.id!==id); save(); render(); } }
});

function moveStay(stopId,slug,dir){
  const s=find(stopId); if(!s||!s.stays) return;
  const i=s.stays.findIndex(x=>x.slug===slug); const ni=i+dir;
  if(i<0||ni<0||ni>=s.stays.length) return;
  const a=s.stays; [a[i],a[ni]]=[a[ni],a[i]]; save(); render();
}

function find(id){ return state.items.find(i=>i.id===id); }
function moveItem(id,dir){
  const idx=state.items.findIndex(i=>i.id===id); const ni=idx+dir;
  if(ni<0||ni>=state.items.length) return;
  const a=state.items; [a[idx],a[ni]]=[a[ni],a[idx]]; save(); render();
}

/* Toolbar */
document.getElementById("addStop").onclick=()=>openStop(null);
document.getElementById("addJourney").onclick=()=>openJourney(null);
document.getElementById("editHead").onclick=openHead;
document.getElementById("filterBook").onclick=function(){ bookFilter=!bookFilter; this.classList.toggle("on",bookFilter); this.textContent=bookFilter?"Show everything":"Show bookings only"; render(); };
document.getElementById("expandAll").onclick=function(){
  const stops=state.items.filter(i=>i.type==="stop").map(i=>i.id);
  const allOpen = stops.every(id=>expanded.has(id));
  if(allOpen){ expanded.clear(); this.textContent="Expand all"; } else { stops.forEach(id=>expanded.add(id)); this.textContent="Collapse all"; }
  render();
};
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="grand-tour-"+new Date().toISOString().slice(0,10)+".json"; a.click();
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=function(){
  const f=this.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d&&d.items){ state=d; expanded=new Set(state.items.filter(i=>i.type==="stop").map(i=>i.id)); save(); render(); } else alert("That file does not look like a saved itinerary."); }catch(e){ alert("Could not read that file."); } };
  r.readAsText(f); this.value="";
};
document.getElementById("resetBtn").onclick=()=>{ if(confirm("Reset to the original planned itinerary? Your edits will be lost unless you have exported them.")){ state=clone(SEED); expanded=new Set(state.items.filter(i=>i.type==="stop").map(i=>i.id)); save(); render(); } };

const scrim=document.getElementById("scrim"), modal=document.getElementById("modal");
function openModal(html){ modal.innerHTML=html; scrim.classList.add("show"); }
function closeModal(){ scrim.classList.remove("show"); modal.innerHTML=""; }
scrim.addEventListener("click", e=>{ if(e.target===scrim) closeModal(); });
function val(id){ const e=document.getElementById(id); return e?e.value.trim():""; }
function checked(id){ const e=document.getElementById(id); return e?e.checked:false; }

function fld(id,label,value,type){ type=type||"text"; return '<div class="fld"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value||"")+'"></div>'; }
function area(id,label,value){ return '<div class="fld"><label>'+label+'</label><textarea id="'+id+'">'+esc(value||"")+'</textarea></div>'; }
function sel(id,label,value,opts){ return '<div class="fld"><label>'+label+'</label><select id="'+id+'">'+opts.map(o=>'<option value="'+o[0]+'"'+(o[0]===value?' selected':'')+'>'+o[1]+'</option>').join("")+'</select></div>'; }
const STATUS_OPTS=[["","— none —"],["idea","Idea"],["tobook","To book"],["booked","Booked"]];

/* Trip header */
function openHead(){
  openModal('<h3>Rename the trip</h3><p class="mhint">Top-of-page wording. HTML entities are fine.</p>'+
    fld("h_eye","Eyebrow",state.meta.eyebrow)+
    fld("h_title","Title",state.meta.title)+
    fld("h_sub","Subtitle",state.meta.subtitle)+
    actions("saveHead"));
  document.getElementById("saveHead").onclick=()=>{ state.meta.eyebrow=val("h_eye"); state.meta.title=val("h_title"); state.meta.subtitle=val("h_sub"); save(); render(); closeModal(); };
}

/* Stop editor */
function openStop(id){
  const s = id?find(id):{ id:uid("s"), type:"stop", guide:[] , place:"", region:"", country:"", flag:"", dateStart:"", dateEnd:"", lodgingName:"", lodgingType:"", lodgingStatus:"", summary:"" };
  openModal('<h3>'+(id?"Edit stop":"New stop")+'</h3>'+
    fld("p_place","Place",s.place)+
    fld("p_region","Subtitle / area",s.region)+
    '<div class="two">'+fld("p_country","Country",s.country)+fld("p_flag","Label (small tag)",s.flag)+'</div>'+
    '<div class="two">'+fld("p_ds","Arrive",s.dateStart,"date")+fld("p_de","Leave",s.dateEnd,"date")+'</div>'+
    '<div class="two">'+fld("p_ln","Staying at",s.lodgingName)+fld("p_lt","Lodging type",s.lodgingType)+'</div>'+
    sel("p_ls","Booking status",s.lodgingStatus,STATUS_OPTS)+
    area("p_sum","Summary",s.summary)+
    actions("saveStop"));
  document.getElementById("saveStop").onclick=()=>{
    s.place=val("p_place"); s.region=val("p_region"); s.country=val("p_country"); s.flag=val("p_flag");
    s.dateStart=val("p_ds"); s.dateEnd=val("p_de"); s.lodgingName=val("p_ln"); s.lodgingType=val("p_lt");
    s.lodgingStatus=val("p_ls"); s.summary=val("p_sum");
    if(!id){ state.items.push(s); expanded.add(s.id); }
    save(); render(); closeModal();
  };
}

/* Guide item editor */
function openGuide(stopId,gid){
  const s=find(stopId);
  const g = gid?s.guide.find(x=>x.id===gid):{ id:uid("g"), cat:"see", title:"", note:"", ticket:false, status:"" };
  openModal('<h3>'+(gid?"Edit tip":"New tip")+'</h3>'+
    sel("gi_cat","Category",g.cat,[["see",CAT.see],["eat",CAT.eat],["exp",CAT.exp],["note",CAT.note]])+
    fld("gi_title","Title",g.title)+
    area("gi_note","Note",g.note)+
    '<div class="fld check"><input type="checkbox" id="gi_ticket"'+(g.ticket?" checked":"")+'><label>Needs a ticket</label></div>'+
    sel("gi_status","Status",g.status,STATUS_OPTS)+
    actions("saveGuide"));
  document.getElementById("saveGuide").onclick=()=>{
    g.cat=val("gi_cat"); g.title=val("gi_title"); g.note=val("gi_note"); g.ticket=checked("gi_ticket"); g.status=val("gi_status");
    if(!gid){ s.guide=s.guide||[]; s.guide.push(g); }
    save(); render(); closeModal();
  };
}

/* Journey editor (incl. options) */
function openJourney(id){
  const j = id?find(id):{ id:uid("j"), type:"journey", mode:"car", from:"", to:"", date:"", depart:"", arrive:"", duration:"", operator:"", status:"", note:"", options:[], decision:"" };
  j.options=j.options||[];
  let optEditors = j.options.map((o,i)=>optEditor(o,i)).join("");
  openModal('<h3>'+(id?"Edit journey":"New journey")+'</h3>'+
    sel("j_mode","Mode",j.mode,[["plane","Plane"],["train","Train"],["car","Car"],["ferry","Ferry"],["coach","Coach / bus"]])+
    '<div class="two">'+fld("j_from","From",j.from)+fld("j_to","To",j.to)+'</div>'+
    fld("j_date","Date",j.date,"date")+
    '<div class="two">'+fld("j_dep","Depart",j.depart)+fld("j_arr","Arrive",j.arrive)+'</div>'+
    '<div class="two">'+fld("j_dur","Duration",j.duration)+fld("j_op","Operator / via",j.operator)+'</div>'+
    sel("j_status","Status",j.status,STATUS_OPTS)+
    area("j_note","Note",j.note)+
    '<div class="fld"><label>Options (for a decision still to make)</label><div id="optList">'+optEditors+'</div>'+
      '<button class="icon-btn" id="addOpt" type="button">+ Add an option</button></div>'+
    fld("j_dec","Decision note",j.decision)+
    actions("saveJourney"));
  document.getElementById("addOpt").onclick=()=>{ const list=document.getElementById("optList"); const i=list.children.length; const div=document.createElement("div"); div.innerHTML=optEditor({label:"",detail:"",pros:"",cons:""},i); list.appendChild(div.firstChild); };
  document.getElementById("saveJourney").onclick=()=>{
    j.mode=val("j_mode"); j.from=val("j_from"); j.to=val("j_to"); j.date=val("j_date");
    j.depart=val("j_dep"); j.arrive=val("j_arr"); j.duration=val("j_dur"); j.operator=val("j_op");
    j.status=val("j_status"); j.note=val("j_note"); j.decision=val("j_dec");
    const list=document.getElementById("optList"); const opts=[];
    Array.from(list.querySelectorAll(".opt-edit")).forEach(box=>{
      const get=c=>{ const e=box.querySelector("."+c); return e?e.value.trim():""; };
      const label=get("oe_label");
      if(label||get("oe_detail")) opts.push({ label:label, detail:get("oe_detail"), pros:get("oe_pros"), cons:get("oe_cons") });
    });
    j.options=opts;
    if(!id) state.items.push(j);
    save(); render(); closeModal();
  };
}
function optEditor(o,i){
  return '<div class="opt-edit">'+
    '<button class="icon-btn danger rm" type="button" onclick="this.parentNode.remove()">remove</button>'+
    '<div class="fld"><label>Label</label><input class="oe_label" value="'+esc(o.label)+'"></div>'+
    '<div class="fld"><label>Detail</label><textarea class="oe_detail">'+esc(o.detail)+'</textarea></div>'+
    '<div class="two"><div class="fld"><label>For</label><input class="oe_pros" value="'+esc(o.pros)+'"></div>'+
    '<div class="fld"><label>Against</label><input class="oe_cons" value="'+esc(o.cons)+'"></div></div>'+
  '</div>';
}
function actions(saveId){ return '<div class="modal-actions"><span></span><div class="right"><button class="btn" onclick="closeModalGlobal()" style="border-color:var(--line)">Cancel</button><button class="btn" id="'+saveId+'">Save</button></div></div>'; }
window.closeModalGlobal=closeModal;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

render();

<script>
  (function(){
    const cfg = window.SYNC || {};
    const statusEl = document.getElementById("syncStatus");
    const setStatus = (t,c)=>{ if(statusEl){ statusEl.textContent=t; statusEl.className="sync "+c; } };
    if(!(cfg.url && cfg.secret && cfg.doc)){
      setStatus("Local only","off");
      return;
    }
    const base = cfg.url.replace(/\/+$/,"") + "/trip/" + encodeURIComponent(cfg.doc);
    let myLastTs = 0;   // ts of our most recent write (to ignore our own echo)
    let seenTs   = 0;   // ts we have already applied
    let saveTimer = null;

    setStatus("Connecting","wait");

    function push(state){
      const ts = Date.now();
      myLastTs = ts;
      return fetch(base, {
        method:"PUT",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.secret },
        body: JSON.stringify({ data: JSON.stringify(state), ts: ts })
      }).then(r=>{
        if(!r.ok) throw new Error(r.status);
        seenTs = ts;
        setStatus("Live","on");
      }).catch(()=> setStatus("Sync error","off"));
    }

    window.cloud = { save:(state)=>{           // debounced upload, called by save()
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=> push(state), 400);
    }};

    function pull(){
      return fetch(base, { headers:{ "Accept":"application/json" } })
        .then(r=>{
          if(r.status === 204) return null;     // nothing stored yet
          if(!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(doc=>{
          if(!doc){                             // empty cloud -> seed it from our state
            if(window.getState) push(window.getState());
            else setStatus("Live","on");
            return;
          }
          if(doc.ts && doc.ts !== myLastTs && doc.ts !== seenTs){
            try{ const remote = JSON.parse(doc.data); if(window.applyRemote) window.applyRemote(remote); }catch(e){}
            seenTs = doc.ts;
          }
          setStatus("Live","on");
        })
        .catch(()=> setStatus("Offline","off"));
    }

    pull();                      // initial sync
    setInterval(pull, 4000);     // poll for remote changes
  })();
</script>
